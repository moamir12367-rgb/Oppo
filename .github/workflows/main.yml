name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Java 17 setup
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Debug APK banao
        run: |
          F=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$F" ]; then echo "ERROR: settings.gradle repo mein nahi mili, files upload karo"; ls -R | head -50; exit 1; fi
          DIR=$(dirname "$F")
          echo "Project folder: $DIR"
          cd "$DIR"
          gradle assembleDebug --no-daemon

      - name: APK upload karo
        uses: actions/upload-artifact@v4
        with:
          name: MilkmanEntry-APK
          path: "**/build/outputs/apk/debug/*.apk"
