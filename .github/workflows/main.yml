name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Java 17 setup
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Debug APK banao
        run: |
          Z=$(find . -maxdepth 2 -iname '*.zip' -not -path './.git/*' | head -n 1)
          if [ -n "$Z" ]; then
            echo "Zip mili: $Z"
            mkdir -p /tmp/proj
            unzip -o -q "$Z" -d /tmp/proj
            DIR=/tmp/proj
          else
            DIR=.
          fi
          F=$(find "$DIR" -name settings.gradle -not -path '*/.git/*' | head -n 1)
          if [ -z "$F" ]; then echo "ERROR: settings.gradle nahi mili"; ls -R "$DIR" | head -50; exit 1; fi
          cd "$(dirname "$F")"
          echo "Project folder: $(pwd)"
          gradle assembleDebug --no-daemon
          mkdir -p /tmp/out && cp app/build/outputs/apk/debug/*.apk /tmp/out/

      - name: APK upload karo
        uses: actions/upload-artifact@v4
        with:
          name: MilkmanEntry-APK
          path: /tmp/out/*.apk
